<nav class="bb b--light-gray app-header">
    <a class="app-header__brand" href="/" title="Home">
        <span class="f5 fw6">Report Review Server</span>
        <span class="app-header__version f7">v{{ version }}</span>
    </a>

    <a class="app-header__institute" href="http://www.unispital-basel.ch/index.php?id=1899"
       title="Universitätsspital Basel, Klinik für Radiologie und Nuklearmedizin">
        <span class="app-header__institute-text">
            Klinik für Radiologie und Nuklearmedizin
        </span>
        <img class="app-header__logo" src="{{ url_for('static', filename='images/logo.svg') }}" alt="Universitätsspital Basel">
    </a>
</nav>

<div class="card-panel mt3">
    <div class="pa2">
        <div class="flex items-center mb2">
            <h1 class="f3 di-ns pr2 mv0">Review</h1>
            <button class="black f7 ba bg-light-yellow b--light-yellow infoReview">Info</button>
        </div>
        <p class="black-70 lh-copy mt0 mb3">Overview of all radiology reports for the selected day.</p>
        <form class="cf" action="/">
            <div class="pv2 flex">
                <label class="f6 pa2" for="datepicker">Date </label>
                <input id="datepicker"
                       class="f6 pa2 input-reset ba bg-transparent hover-bg-grey hover-black b--near-black w-10 dateTextField"
                       value="{{ day }}" type="text"
                       name="day" placeholder="day">
                <label class="f6 pa2" for="writer">Writer </label>
                <input id="writer"
                       class="f6 pa2 input-reset ba bg-transparent hover-bg-grey hover-black b--near-black w-20"
                       value="{{ writer }}" type="text"
                       name="writer" placeholder="Windows login name"
                       {% if not has_general_approval_rights %}readonly {% endif %}>
                <label class="f6 pa2" for="reviewer">Reviewer </label>
                <input id="reviewer"
                       class="f6 pa2 input-reset ba bg-transparent hover-bg-grey hover-black b--near-black w-20"
                       value="{{ reviewer }}" type="text"
                       name="reviewer" placeholder="Windows login name">
                <label class="f6 pa2" for="report_status">Status </label>
                <input id="report_status"
                       class="f6 pa2 input-reset ba bg-transparent hover-bg-grey hover-black b--near-black w-10"
                       value="{{ report_status }}" type="text"
                       name="report_status" placeholder="F">
                <input class="black f6 input-reset pa2 ba bg-yellow b--yellow pointer" type="submit" value="Search">
            </div>
        </form>
    </div>
</div>
